<style>:root{color-scheme:light}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CCST26-27 球衣征订查询</title>
<style>
/* Layout: single centered column — search bar up top, result card below, team totals at the foot. */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --fg:#17202b; --muted:#6a7280;
  --line:#dcd8d0; --accent:#1b3f8f; --accent-soft:#e6ecf8;
  --warn:#8a5a00; --warn-bg:#fdf3dc; --ok:#1f6b45; --hot:#c0352b; --money:#1f6b45;
  --font-d:"Oswald","Arial Narrow",Impact,sans-serif;
  --font-b:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c; --surface:#1a2029; --fg:#e8eaee; --muted:#98a1ae;
  --line:#2c3440; --accent:#7fa6ee; --accent-soft:#1d2a44;
  --warn:#e8bf6a; --warn-bg:#2e2718; --ok:#6cc79a; --hot:#ff8d80; --money:#6cc79a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1a2029; --fg:#e8eaee; --muted:#98a1ae;
  --line:#2c3440; --accent:#7fa6ee; --accent-soft:#1d2a44;
  --warn:#e8bf6a; --warn-bg:#2e2718; --ok:#6cc79a; --hot:#ff8d80; --money:#6cc79a; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);line-height:1.6;
  padding-inline:16px;padding-block:28px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:6px}
.kicker{font-family:var(--font-d);letter-spacing:.14em;text-transform:uppercase;
  font-size:15px;color:var(--accent);font-weight:600}
h1{font-family:var(--font-d);font-weight:600;font-size:clamp(26px,6vw,38px);margin:0;
  letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0}
.searchbox{position:relative}
input[type=search]{width:100%;padding:14px 16px;font-size:16px;font-family:inherit;
  border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.hits{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.hits button{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.hits button:hover{border-color:var(--accent);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:20px;display:flex;flex-direction:column;gap:16px}
.card h2{font-family:var(--font-d);font-size:24px;margin:0;font-weight:600}
.meta{color:var(--muted);font-size:13px;margin:-10px 0 0}
.items{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:baseline;gap:6px;border-radius:8px;padding:7px 12px;
  background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:600}
.chip span{font-variant-numeric:tabular-nums}
.none{color:var(--muted);font-size:14px}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0;font-size:14px}
dt{color:var(--muted)}
dd{margin:0;min-width:0;overflow-wrap:anywhere}
dd.hot{color:var(--hot);font-weight:600}
dd.money{color:var(--money);font-weight:600}
.note{display:block;margin-top:2px;color:var(--warn);font-size:12.5px;font-weight:400;line-height:1.45}
.flag{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:12px 14px;font-size:14px}
.flag strong{display:block;margin-bottom:4px}
.flag ul{margin:0;padding-left:18px}
.totals{border-top:1px solid var(--line);padding-top:18px}
.totals h3{font-family:var(--font-d);font-size:16px;letter-spacing:.08em;text-transform:uppercase;
  margin:0 0 12px;font-weight:600;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
td.n,th.n{text-align:right}
.tablewrap{overflow-x:auto}
footer{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}
footer p{margin:0 0 6px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Noto+Sans+SC:wght@400;600&display=swap">

<div class="wrap">

    <p>训练服自费约 ¥140/件，不印号码，胸前可印名字首字母。</p>
  </footer>
</div>

const people = DATA.filter(p => !p.test);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const q = document.getElementById('q');
const hits = document.getElementById('hits');
const result = document.getElementById('result');

function search(term){
  const t = term.trim().toLowerCase();
  if(!t) return [];
  return people.filter(p =>
    p.name.toLowerCase().includes(t) ||
    String(p.wechat).toLowerCase().includes(t) ||
    String(p.back).toLowerCase().includes(t));
}

function render(p){
  const items = [];
  if(p.home) items.push(['主场球衣（蓝白）', p.home]);
  if(p.away) items.push(['客场球衣（黑蓝）', p.away]);
  if(p.gkh)  items.push(['门将主场', p.gkh]);
  if(p.gka)  items.push(['门将客场', p.gka]);
  if(p.train)items.push(['训练服', p.train]);

  const rows = [];
  if(p.jersey_total) rows.push(['球衣尺码', p.jsize_txt || '— 未填 —']);
  if(p.train) rows.push(['训练服尺码', p.tsize_txt || '— 未填 —']);
  if(p.train){
    const L = String(p.letters || '').trim();
    const skip = /^(无|没有|不印|不印字母|不需要|n\/?a|none|no)$/i.test(L);
    const bad = L && !skip &&
      (/[\u4e00-\u9fa5]/.test(L) || /\s/.test(L) || L.replace(/[^A-Za-z]/g,'').length > 4);
    rows.push(['胸前字母', skip ? '不印' : (L || '—'), 'hot',
      bad ? '胸前只能印少量字母（通常是名字首字母），印不下全名。请联系队委修改。' : '']);
  }
  if(p.jersey_total){
    const winter = p.reimb === '球队报销一套球衣-冬季联赛';
    const num = p.race || p.memo;
    rows.push(['已分配号码', num ? num + (winter ? '（冬季联赛）' : (p.reimb === '自费' ? '（纪念号）' : '')) : '待分配', 'hot']);
    rows.push(['你填的首选号码', p.n1 || '—']);
    if(p.n2) rows.push(['你填的备选号码', p.n2]);
    if(p.n3) rows.push(['你想要的纪念号', p.n3]);
    rows.push(['后印名字', p.back || '—', 'hot']);
  }
  rows.push(['参赛意向', p.comp_txt || '—', '', '实际以下方「费用/报销」核定结果为准。']);
  rows.push(['费用/报销', p.reimb || (p.fee_txt ? p.fee_txt + '（待队委确认）' : '待队委确认'), 'money']);
  if(p.reimb === '球队报销一套球衣-冬季联赛')
    rows.push(['报销范围', '球队报销主场蓝白色 1 件（冬季联赛）' +
      ((p.away + p.gkh + p.gka) > 0 ? '，客场自费（请联系确认）' : '，其余自费'), 'money']);
  rows.push(['领取方式', p.pick_txt || '—']);
  if(p.addr && !PUBLIC) rows.push(['快递地址', p.addr]);
  if(p.wechat && !PUBLIC) rows.push(['微信号', p.wechat]);

  result.innerHTML = `<div class="card">
    <h2>${esc(p.name)}</h2>
    <p class="meta">共 ${p.total} 件 · 问卷提交序号 ${p.seqs.join('、')}</p>
    <div class="items">${
      items.length ? items.map(([k,v]) => `<span class="chip">${esc(k)}<span>×${v}</span></span>`).join('')
                   : '<span class="none">这份提交没有勾选任何球衣或训练服。</span>'}</div>
    <dl>${rows.map(([k,v,cls,note]) =>
      `<dt>${esc(k)}</dt><dd${cls ? ` class="${cls}"` : ''}>${esc(v)}${
        note ? `<span class="note">${esc(note)}</span>` : ''}</dd>`).join('')}</dl>
    ${p.issues.length ? `<div class="flag"><strong>需要你确认</strong><ul>${
      p.issues.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>` : ''}
  </div>`;
}

function update(){
  const r = search(q.value);
  if(!q.value.trim()){ hits.innerHTML=''; result.innerHTML=''; return; }
  if(r.length === 1){ hits.innerHTML=''; render(r[0]); return; }
  result.innerHTML = '';
  hits.innerHTML = r.length
    ? r.slice(0,12).map((p,i) => `<li><button data-i="${people.indexOf(p)}">${esc(p.name)}</button></li>`).join('')
    : '<li class="none">没找到这个名字，可能是没提交，或者填写的姓名不一样。</li>';
}
q.addEventListener('input', update);
hits.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const p = people[+b.dataset.i];
  q.value = p.name; hits.innerHTML=''; render(p);
});

const sum = k => people.reduce((a,p) => a + (p[k]||0), 0);
const cnt = k => people.filter(p => p[k]).length;
const sizeRows = (key, sizes, filter) => sizes.map(s => {
  const g = people.filter(p => filter(p) && p[key] === s);
  return [s, g.length];
}).filter(r => r[1]);

const jSizes = sizeRows('jsize_txt', ['XS','S','M','L','XL','2XL','3XL','4XL'], p => p.jersey_total>0);
const tSizes = sizeRows('tsize_txt', ['S','M','L','XL','2XL','3XL','4XL'], p => p.train>0);

document.getElementById('totals').innerHTML = `
  <tr><th>项目</th><th class="n">件数</th><th class="n">人数</th></tr>
  <tr><td>主场球衣（蓝白）</td><td class="n">${sum('home')}</td><td class="n">${cnt('home')}</td></tr>
  <tr><td>客场球衣（黑蓝）</td><td class="n">${sum('away')}</td><td class="n">${cnt('away')}</td></tr>
  <tr><td>门将主场</td><td class="n">${sum('gkh')}</td><td class="n">${cnt('gkh')}</td></tr>
  <tr><td>门将客场</td><td class="n">${sum('gka')}</td><td class="n">${cnt('gka')}</td></tr>
  <tr><td><strong>球衣合计</strong></td><td class="n"><strong>${sum('jersey_total')}</strong></td><td class="n"><strong>${cnt('jersey_total')}</strong></td></tr>
  <tr><td>训练服</td><td class="n">${sum('train')}</td><td class="n">${cnt('train')}</td></tr>
  <tr><td>球衣尺码分布</td><td class="n" colspan="2">${jSizes.map(r => r[0]+' ×'+r[1]+'人').join(' · ')}</td></tr>
  <tr><td>训练服尺码分布</td><td class="n" colspan="2">${tSizes.map(r => r[0]+' ×'+r[1]+'人').join(' · ')}</td></tr>`;
document.getElementById('np').textContent = people.length;
</script>
